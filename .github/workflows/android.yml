name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # Shared Android SDK location for every job.
  ANDROID_HOME: /opt/android-sdk
  ANDROID_SDK_ROOT: /opt/android-sdk

jobs:
  # Builds the debug APK on every push to main, on PRs, and on manual dispatch.
  build:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          set -eu
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            curl -sSL "$CMDLINE_TOOLS_URL" -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            install -d "$ANDROID_HOME/cmdline-tools/latest"
            mv /tmp/cmdline-tools/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
            rm -rf /tmp/cmdline-tools /tmp/cmdline-tools.zip
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
            gradle-

      - name: Build debug APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-debug.log
          exit "${PIPESTATUS[0]}"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-debug-log
          path: /tmp/gradle-debug.log
          if-no-files-found: ignore

      - name: Upload debug APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Optional signed release build. It only runs its steps when a keystore is
  # supplied via the RELEASE_KEYSTORE_BASE64 secret (plus KS_PASS /
  # KS_KEY_PASS / KS_ALIAS). The keystore is decoded at runtime and never
  # committed to the repository.
  #
  # Note: the `secrets`/`env` contexts are NOT accepted in a job-level `if:`
  # on this GitHub instance, so the job is always defined and each step is
  # gated individually with a step-level `if:` (where `env` is valid). When
  # the secret is absent every step is skipped and the job is a no-op.
  release:
    name: Release APK
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        uses: actions/checkout@v5

      - name: Set up JDK 17
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          set -eu
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            curl -sSL "$CMDLINE_TOOLS_URL" -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            install -d "$ANDROID_HOME/cmdline-tools/latest"
            mv /tmp/cmdline-tools/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
            rm -rf /tmp/cmdline-tools /tmp/cmdline-tools.zip
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH" >> "$GITHUB_ENV"

      - name: Restore signing keystore
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p app
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore
          ls -l app/release.keystore

      - name: Cache Gradle
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: gradle-${{ runner.os }}-release-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-
            gradle-

      - name: Build signed release APK
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_KEY_PASS: ${{ secrets.KS_KEY_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
