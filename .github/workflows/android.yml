name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# Exposed at the workflow level so the release job can gate on its presence.
# The `secrets` context is NOT allowed in a job-level `if:`, so we forward it
# to an env var and check the env var instead.
env:
  RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds the debug APK on every push to main, on PRs, and on manual dispatch.
  build:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          build-tools: 35.0.0
          platforms: android-35

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
            gradle-

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Optional signed release build. Runs only when a keystore is supplied via the
  # RELEASE_KEYSTORE_BASE64 secret plus KS_PASS / KS_KEY_PASS / KS_ALIAS. The
  # keystore is decoded at runtime and never committed to the repository.
  release:
    name: Release APK
    runs-on: ubuntu-latest
    if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          build-tools: 35.0.0
          platforms: android-35

      - name: Restore signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p app
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore
          ls -l app/release.keystore

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: gradle-${{ runner.os }}-release-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-
            gradle-

      - name: Build signed release APK
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_KEY_PASS: ${{ secrets.KS_KEY_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
